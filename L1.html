<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLife - Interface L1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Fondo dinámico */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('jj.png') no-repeat center center fixed;
            background-size: cover;
            filter: brightness(0.4) saturate(0.8) contrast(1.1);
            z-index: -2;
        }

        .cyber-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10, 20, 38, 0.4) 0%, rgba(2, 6, 12, 0.85) 100%);
            z-index: -1;
        }

        /* 3. ANIMACIÓN DE ENTRADA (De arriba hacia abajo) */
        .wrapper {
            width: 100%;
            max-width: 850px;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bootUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes bootUp {
            0% {
                transform: translateY(-50px);
                opacity: 0;
                filter: blur(5px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
                filter: blur(0);
            }
        }

        /* Encabezado */
        header {
            text-align: left;
            width: 100%;
            border-bottom: 2px solid rgba(0, 210, 255, 0.3);
            padding-bottom: 15px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 80px;
            height: 2px;
            background: #00d2ff;
            box-shadow: 0 0 10px #00d2ff;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin: 0;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 700;
        }

        header .serial-number {
            font-size: 0.85rem;
            color: #00d2ff;
            font-family: 'Orbitron', sans-serif;
            opacity: 0.8;
            margin-top: 5px;
        }

        .exposition-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Tarjetas de exposición */
        .info-card {
            background: rgba(4, 12, 24, 0.65);
            border: 1px solid rgba(0, 210, 255, 0.15);
            border-left: 4px solid #00d2ff;
            padding: 25px 30px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .info-card:hover {
            background: rgba(4, 12, 24, 0.8);
            border-color: rgba(0, 210, 255, 0.4);
        }

        /* 1. LEDS PARPADEANTES CON DELAYS ASÍNCRONOS */
        .android-led {
            position: absolute;
            top: 25px;
            right: 30px;
            width: 12px;
            height: 12px;
            background-color: #00d2ff;
            border-radius: 50%;
            animation: ledPulse 2s infinite ease-in-out;
        }

        /* Generamos retrasos diferentes dinámicamente usando CSS */
        .info-card:nth-child(1) .android-led { animation-delay: 0s; }
        .info-card:nth-child(2) .android-led { animation-delay: 0.6s; }
        .info-card:nth-child(3) .android-led { animation-delay: 1.2s; }
        .info-card:nth-child(4) .android-led { animation-delay: 1.8s; }

        @keyframes ledPulse {
            0%, 100% {
                box-shadow: 0 0 6px #00d2ff, 0 0 12px #00d2ff;
                opacity: 0.5;
            }
            50% {
                box-shadow: 0 0 15px #00d2ff, 0 0 30px #00d2ff;
                opacity: 1;
            }
        }

        /* 2. LÍNEA DE SELECCIÓN ABAJO (Efecto de escaneo) */
        .info-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d2ff, transparent);
            box-shadow: 0 0 12px #00d2ff;
            transition: width 0.4s ease, left 0.4s ease;
        }

        /* Clase activa que se añade mediante JS al hacer clic */
        .info-card.selected::after {
            width: 100%;
            left: 0;
        }

        .info-card.selected {
            background: rgba(0, 210, 255, 0.08);
            border-color: rgba(0, 210, 255, 0.5);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            color: #00d2ff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .card-content {
            font-size: 1.15rem;
            color: #e2e8f0;
            line-height: 1.6;
            font-weight: 500;
        }

        .card-content ul {
            list-style: none;
            padding-left: 0;
            margin: 15px 0 0 0;
        }

        .card-content li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .card-content li::before {
            content: "➔";
            position: absolute;
            left: 0;
            color: #00d2ff;
            font-size: 0.9rem;
        }

        /* Botón de Inestabilidad */
        .footer-section {
            margin-top: 60px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
        }

        .btn-restart {
            font-family: 'Orbitron', sans-serif;
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            border: 1px solid #ff3b30;
            padding: 14px 35px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
            animation: softwareInstability 2.5s infinite ease-in-out;
        }

        .btn-restart:hover {
            background: #ff3b30;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 59, 48, 0.6);
            animation: none;
        }

        .btn-restart::after {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            margin-left: 15px;
            box-shadow: 0 0 8px #ff3b30;
            vertical-align: middle;
        }
        
        .btn-restart:hover::after {
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff;
        }

        @keyframes softwareInstability {
            0%, 100% {
                border-color: rgba(255, 59, 48, 0.3);
                box-shadow: 0 0 5px rgba(255, 59, 48, 0.1);
                color: rgba(255, 59, 48, 0.6);
            }
            50% {
                border-color: #ff3b30;
                box-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
                color: #ff3b30;
            }
        }
    </style>
</head>
<body>

    <div class="cyber-bg"></div>
    <div class="cyber-overlay"></div>

    <div class="wrapper">
        <header>
            <h1>Sistemas del Servidor</h1>
            <div class="serial-number">LOAD</div>
        </header>

        <!-- Bloques de información manipulables desde aquí -->
        <div class="exposition-container" id="expositionLayout">
            <!-- Inyección dinámica -->
        </div>

        <div class="footer-section">
            <a href="inicio.html" class="btn-restart">¿Comenzar de nuevo?</a>
        </div>
    </div>

    <script>
        /**
         * ====================================================================
         * AGREGA O EDITA TU INFORMACIÓN AQUÍ
         * ====================================================================
         */
        const informacionExposicion = [
            {
                titulo: "¿Qué es?",
                contenido: `La carga paralela (Load) es una función que permite cargar un valor específico en el contador, en lugar de comenzar desde cero o desde el valor máximo. Para ello, el contador dispone de entradas de datos donde se introduce el número que se desea almacenar
                <ul>
                    <li> </li>
                    <li>Load síncrono: carga el valor cuando llega el siguiente pulso de reloj.</li>
                    <li>Load asíncrono: carga el valor inmediatamente, sin esperar un pulso de reloj.</li>
                </ul>`
            },
            {
                titulo: "Aplicación",
                contenido: `Los sistemas de contadores síncronos dentro de la CPU de losSe utiliza cuando es necesario iniciar el contador desde un valor determinado, en lugar de comenzar siempre desde cero. componentes androides regulan los ciclos de análisis lógico en tiempo real. Cualquier interrupción en los pulsos de reloj generará inestabilidad en las directrices principales.`
            },
        ];

        function inicializarExposicion() {
            const container = document.getElementById('expositionLayout');
            container.innerHTML = ''; 

            informacionExposicion.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'info-card';
                
                card.innerHTML = `
                    <div class="android-led"></div>
                    <div class="card-title">${item.titulo}</div>
                    <div class="card-content">${item.contenido}</div>
                `;
                
                // Evento para activar la línea de selección al hacer clic
                card.addEventListener('click', () => {
                    // Quita la selección de las otras tarjetas
                    document.querySelectorAll('.info-card').forEach(c => c.classList.remove('selected'));
                    // Añade selección a la tarjeta clickeada
                    card.classList.add('selected');
                });
                
                container.appendChild(card);
            });
        }

        inicializarExposicion();
    </script>
</body>
</html>
