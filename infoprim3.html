<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta del Sistema - Registro 2038</title>
    <style>
        /* Importar fuente futurista */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap');

        :root {
            --cyber-red: #ff3b3b;
            --cyber-red-glow: rgba(255, 59, 59, 0.6);
            --dark-bg: rgba(15, 10, 10, 0.85);
            --light-text: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--light-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Mantiene tu fondo dinámico con un tinte más rojizo de advertencia */
            background: linear-gradient(rgba(30, 0, 0, 0.6), rgba(15, 0, 0, 0.8)), url('checha.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            padding: 20px;
        }

        /* Contenedor de Alerta Principal */
        .alert-container {
            max-width: 600px;
            width: 100%;
            background: var(--dark-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--cyber-red);
            border-left: 5px solid var(--cyber-red);
            border-radius: 4px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(255, 59, 59, 0.2);
            text-align: center;
            animation: area-glow 4s infinite alternate;
        }

        /* Icono de peligro titilante */
        .alert-icon {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: var(--cyber-red);
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--cyber-red-glow);
            animation: blink 1.5s infinite alternate;
        }

        .alert-container h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--cyber-red), transparent);
            margin-bottom: 25px;
        }

        .alert-message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .system-notice {
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-red);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        /* Botón Volver Rojo */
        .btn-back {
            display: inline-block;
            text-decoration: none;
            background: transparent;
            border: 1px solid var(--cyber-red);
            color: var(--cyber-red);
            padding: 12px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.1);
        }

        .btn-back:hover {
            background: var(--cyber-red);
            color: #fff;
            box-shadow: 0 0 20px var(--cyber-red-glow);
            transform: translateY(-2px);
        }

        /* Animaciones Cyberpunk */
        @keyframes blink {
            from { opacity: 0.4; text-shadow: 0 0 4px var(--cyber-red-glow); }
            to { opacity: 1; text-shadow: 0 0 15px var(--cyber-red-glow); }
        }

        @keyframes area-glow {
            from { box-shadow: 0 0 20px rgba(255, 59, 59, 0.1); }
            to { box-shadow: 0 0 35px rgba(255, 59, 59, 0.3); }
        }
    </style>
</head>
<body>

    <!-- Panel de Alerta Central -->
    <div class="alert-container">
        <div class="alert-icon">⚠️</div>
        <h1>¡PELIGRO!</h1>
        <div class="divider"></div>
        
        <p class="alert-message">
            No has completado la exposición hasta el momento.<br>
            Detectado intento de salida prematura del módulo actual. Deberás volver al inicio.
        </p>
        
        <div class="system-notice">
            [ ACCIÓN REQUERIDA: REINICIAR PROCESO ]
        </div>

        <!-- Botón de redirección -->
        <a href="infoprim.html" class="btn-back">Volver</a>
    </div>

</body>
</html>
