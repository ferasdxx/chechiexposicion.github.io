<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación del Sistema - Registro 2038</title>
    <style>
        /* Importar fuente futurista */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap');

        :root {
            --cyber-blue: #00d2ff;
            --cyber-blue-glow: rgba(0, 210, 255, 0.4);
            --cyber-red: #ff3b3b;
            --cyber-red-glow: rgba(255, 59, 59, 0.6);
            --cyber-green: #00ff66;
            --cyber-green-glow: rgba(0, 255, 102, 0.6);
            --dark-bg: rgba(10, 15, 20, 0.80);
            --light-text: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--light-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('checha.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            padding: 20px;
        }

        /* Contenedor del Cuadro de Decisión */
        .decision-container {
            max-width: 550px;
            width: 100%;
            background: var(--dark-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--cyber-blue);
            border-radius: 4px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .system-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--cyber-blue);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 5px var(--cyber-blue-glow);
        }

        .decision-container h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0, 210, 255, 0.5), transparent);
            margin-bottom: 30px;
        }

        /* Contenedor de Botones en paralelo */
        .choice-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        /* Estilo base para los enlaces/botones */
        .btn-choice {
            flex: 1;
            max-width: 160px;
            display: inline-block;
            text-decoration: none;
            padding: 12px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-align: center;
            border-radius: 2px;
        }

        /* Variante Opción SÍ (Verde) */
        .btn-yes {
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .btn-yes:hover {
            background: var(--cyber-green);
            color: #000;
            box-shadow: 0 0 20px var(--cyber-green-glow);
            transform: translateY(-2px);
        }

        /* Variante Opción NO (Rojo) */
        .btn-no {
            border: 1px solid var(--cyber-red);
            color: var(--cyber-red);
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.1);
        }

        .btn-no:hover {
            background: var(--cyber-red);
            color: #fff;
            box-shadow: 0 0 20px var(--cyber-red-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Panel de Decisión Central -->
    <div class="decision-container">
        <div class="system-tag">[ REQUERIMIENTO DE CONFIRMACIÓN ]</div>
        <h1>¿Deseas continuar con el proceso?</h1>
        
        <div class="divider"></div>
        
        <!-- Bloque de opciones -->
        <div class="choice-buttons">
            <a href="n1.html" class="btn-choice btn-no">No</a>
            <a href="s1.html" class="btn-choice btn-yes">Si</a>
        </div>
    </div>

</body>
</html>
