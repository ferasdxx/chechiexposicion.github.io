<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegir opción</title>
<style>
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1420;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 60px 20px;
  }
 
  .contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
 
  /* Rectángulo del título, solo */
  .recuadro {
    width: 340px;
    background: #1c2333;
    border: 2px solid #4f7cff;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
 
    opacity: 0;
    transform: translateY(-60px);
    animation: bajarDesdeArriba 0.7s ease forwards;
  }
 
  .recuadro__titulo {
    padding: 14px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eef1ff;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    border-bottom: 2px solid #4f7cff;
  }
 
  .recuadro__contenido {
    padding: 16px 12px;
    color: #b9c2e0;
    font-size: 14px;
    text-align: center;
  }
 
  /* Fila de botones separados, afuera del rectángulo */
  .botones {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    transform: translateY(-30px);
    animation: bajarDesdeArriba 0.6s ease forwards;
    animation-delay: 0.9s;
  }
 
  /* Botón individual estilo "chip" con borde cian */
  .boton {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    background: rgba(15, 25, 35, 0.65);
    border: 1.5px solid #3fd6d6;
    border-radius: 8px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-decoration: none;
    box-shadow: 0 0 12px rgba(63, 214, 214, 0.35);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
 
  .boton:hover {
    box-shadow: 0 0 20px rgba(63, 214, 214, 0.6);
    transform: translateY(-2px);
  }
 
  /* Ícono triángulo (Opción 1) */
  .icono-triangulo {
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 15px solid #3fd6d6;
  }
 
  /* Ícono cuadrado (Opción 2) */
  .icono-cuadrado {
    width: 16px;
    height: 16px;
    border: 2.5px solid #3fd6d6;
  }
 
  @keyframes bajarDesdeArriba {
    from {
      opacity: 0;
      transform: translateY(-60px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
 
  <div class="contenedor">
 
    <div class="recuadro">
      <div class="recuadro__titulo">Contadores</div>
      <div class="recuadro__contenido">Un contador es un circuito digital secuencial que cambia su estado cada vez que recibe un pulso de reloj (clock). Su función es contar pulsos y almacenar el resultado en forma binaria</div>
    </div>
 
    <div class="botones">
      <a href="infoprim2.html" id="infoprim2" class="boton">
        <span class="icono-triangulo"></span>
        INFORMACIÓN PRINCIPAL
      </a>
      <a href="infoprim3.html" id="infoprim3" class="boton">
        <span class="icono-cuadrado"></span>
        INFORMACION DESHABILITADA
      </a>
    </div>
 
  </div>
 
</body>
</html>
